workflows:
  mushaf-android:
    name: Build Mushaf APK
    max_build_duration: 60
    environment:
      flutter: 3.38.6
      java: 17
    scripts:
      - name: Apply uploaded update
        script: |
          set -eu
          UPDATE="mushaf-fix-20261113-f6.zip"
          test -s "$UPDATE"
          unzip -t "$UPDATE"
          unzip -o "$UPDATE" 'lib/*' 'assets/audio/*' 'tool/*' 'notification_resources/*' pubspec.yaml
          test -s lib/main.dart
          test -s lib/worship_tools.dart
          test -s assets/audio/page_turn.wav
          test -s notification_resources/adhan.mp3
          test -s tool/configure_android.dart
          for i in 1 2 3 4 5 6; do
            test -s "assets/BOOK_27070_${i}.pdf"
          done
      - name: Check Flutter version
        script: |
          set -eu
          flutter --version
          dart --version
          dart tool/verify_toolchain.dart
      - name: Create Android project files
        script: |
          set -eu
          if [ ! -d android ]; then
            scaffold=$(mktemp -d)
            flutter create --platforms=android --project-name=mushaf_reader --no-pub "$scaffold"
            cp -R "$scaffold/android" .
          fi
      - name: Configure prayer notifications
        script: |
          set -eu
          dart tool/configure_android.dart
      - name: Install dependencies
        script: flutter pub get
      - name: Verify effective Android configuration
        script: |
          set -eu
          cd android
          chmod +x gradlew
          ./gradlew -I ../tool/verify_android.gradle :app:verifyMushafAndroid --no-daemon
      - name: Analyze code
        script: flutter analyze --no-fatal-infos
      - name: Build optimized APK
        script: |
          set -euo pipefail
          mkdir -p build-diagnostics
          flutter build apk --release --verbose 2>&1 | tee build-diagnostics/release.log
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build-diagnostics/**
      - pubspec.lock

