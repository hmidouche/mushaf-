workflows:
  mushaf-android:
    name: Build Mushaf APK
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Check Flutter version
        script: |
          flutter --version
          dart --version

      - name: Create Android project files
        script: |
          set -e
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --project-name=mushaf_reader \
              /tmp/mushaf_android
            cp -R /tmp/mushaf_android/android .
          fi

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Analyze code
        script: |
          flutter analyze

      - name: Build test APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

